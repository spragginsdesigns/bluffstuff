# pnpm v11 settings file, generated by pnpm during install.
#
# This project is NOT a workspace — there is deliberately no `packages:` key.
# v11 moved settings out of package.json and into this file.
#
# v11 refuses to run dependency postinstall scripts unless each is explicitly
# allowed, and fails the whole install (ERR_PNPM_IGNORED_BUILDS) when any are
# skipped. That non-zero exit would break the Vercel build, so the two this
# project pulls in are answered here. esbuild is what the Convex CLI runs on.
allowBuilds:
  "@clerk/shared": true
  esbuild: true
